version: 2
updates:
    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'weekly'
      open-pull-requests-limit: 10
      cooldown:
          default-days: 5
          semver-major-days: 14
      # Dependabot puts a dependency in the first group it matches,
      # so the catch-all minor-and-patch group must stay last.
      groups:
          oxc:
              patterns:
                  - 'oxlint'
                  - 'oxfmt'
          vitest:
              patterns:
                  - 'vitest'
                  - '@vitest/*'
          react:
              patterns:
                  - 'react'
                  - 'react-dom'
                  - '@types/react'
                  - '@types/react-dom'
          vite:
              patterns:
                  - 'vite'
                  - 'electron-vite'
                  - '@vitejs/*'
          fontawesome:
              patterns:
                  - '@fortawesome/*'
          electron-builder:
              patterns:
                  - 'electron-builder'
                  - 'electron-updater'
          minor-and-patch:
              update-types:
                  - 'minor'
                  - 'patch'

    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'monthly'

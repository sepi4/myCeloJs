version: 2
updates:
    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'weekly'
      open-pull-requests-limit: 10
      cooldown:
          default-days: 5
          semver-major-days: 14
      # eslint-plugin-react does not support ESLint 10 yet, and the failing
      # major blocked the rest of the eslint group. Remove once it does.
      ignore:
          - dependency-name: 'eslint'
            update-types: ['version-update:semver-major']
          - dependency-name: '@eslint/js'
            update-types: ['version-update:semver-major']
      # Dependabot puts a dependency in the first group it matches,
      # so the catch-all minor-and-patch group must stay last.
      groups:
          eslint:
              patterns:
                  - 'eslint'
                  - 'eslint-*'
                  - '@eslint/*'
                  - 'typescript-eslint'
                  - 'globals'
          jest:
              patterns:
                  - 'jest'
                  - 'jest-*'
                  - 'ts-jest'
                  - '@types/jest'
          react:
              patterns:
                  - 'react'
                  - 'react-dom'
                  - '@types/react'
                  - '@types/react-dom'
          vite:
              patterns:
                  - 'vite'
                  - 'electron-vite'
                  - '@vitejs/*'
          fontawesome:
              patterns:
                  - '@fortawesome/*'
          electron-builder:
              patterns:
                  - 'electron-builder'
                  - 'electron-updater'
          minor-and-patch:
              update-types:
                  - 'minor'
                  - 'patch'

    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'monthly'
